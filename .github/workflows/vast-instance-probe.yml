name: Vast guarded remote probe

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: vast-guarded-remote-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      VAST_INSTANCE_ID: ${{ vars.VAST_INSTANCE_ID }}
    steps:
      - name: Read provider state and guard remote access
        id: status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          instance_id = os.environ.get("VAST_INSTANCE_ID", "")
          api_key = os.environ.get("VAST_API_KEY", "")
          report_path = Path(os.environ["GITHUB_WORKSPACE"]) / "vast-probe-report.json"
          connection_path = Path(os.environ["RUNNER_TEMP"]) / "vast-probe-connection.json"
          allowed_states = {
              "running", "stopped", "starting", "stopping", "scheduling",
              "loading", "created", "offline", "unknown", "exited", "error",
          }
          checked_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          report = {
              "schema": "vast-guarded-remote-probe-v1",
              "checked_at_utc": checked_at,
              "instance_found": False,
              "provider_state": "not_checked",
              "remote_read": "not_run",
              "ssh_attempted": False,
              "mutation_performed": False,
              "raw_remote_output_published": False,
              "ok": False,
              "reason": "not_checked",
          }
          should_ssh = False

          def safe_state(value):
              if not isinstance(value, str):
                  return "unavailable"
              value = value.strip().lower()
              return value if value in allowed_states else "other"

          try:
              if not api_key or not re.fullmatch(r"[0-9]{1,20}", instance_id):
                  report["reason"] = "missing_configuration"
              else:
                  request = Request(
                      "https://console.vast.ai/api/v0/instances/",
                      headers={
                          "Authorization": f"Bearer {api_key}",
                          "Accept": "application/json",
                          "User-Agent": "TheQuantumProject-GitHub-Actions/1.0",
                      },
                      method="GET",
                  )
                  with urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read())
                  if isinstance(payload, list):
                      rows = payload
                  elif isinstance(payload, dict) and isinstance(payload.get("instances"), list):
                      rows = payload["instances"]
                  else:
                      rows = None
                  if rows is None:
                      report["reason"] = "unexpected_response_shape"
                  else:
                      matches = [
                          row for row in rows
                          if isinstance(row, dict) and str(row.get("id")) == instance_id
                      ]
                      if len(matches) != 1:
                          report["reason"] = (
                              "fixed_instance_not_found" if not matches
                              else "fixed_instance_ambiguous"
                          )
                      else:
                          row = matches[0]
                          state = safe_state(row.get("actual_status"))
                          if state == "unavailable":
                              state = safe_state(row.get("cur_state"))
                          report["instance_found"] = True
                          report["provider_state"] = state
                          if state == "running":
                              host = row.get("public_ipaddr")
                              ports = row.get("ports")
                              port = None
                              if isinstance(ports, dict):
                                  entries = ports.get("22/tcp")
                                  if isinstance(entries, list) and entries and isinstance(entries[0], dict):
                                      port = entries[0].get("HostPort")
                              host_parts = host.split(".") if isinstance(host, str) else []
                              valid_host = (
                                  len(host_parts) == 4
                                  and all(part.isdigit() and 0 <= int(part) <= 255 for part in host_parts)
                              )
                              if valid_host and isinstance(port, int) and 1 <= port <= 65535:
                                  Path(os.environ["RUNNER_TEMP"], "vast-probe-connection.json").write_text(
                                      json.dumps({"host": host, "port": port}), encoding="utf-8"
                                  )
                                  should_ssh = True
                                  report["remote_read"] = "pending"
                                  report["reason"] = "provider_running"
                                  report["ok"] = True
                              else:
                                  report["reason"] = "ssh_endpoint_unavailable"
                          else:
                              report["remote_read"] = "skipped_instance_not_running"
                              report["reason"] = "provider_not_running"
                              report["ok"] = True
          except HTTPError as exc:
              report["reason"] = f"http_{exc.code}"
          except URLError:
              report["reason"] = "network_error"
          except (json.JSONDecodeError, UnicodeDecodeError):
              report["reason"] = "invalid_json_response"
          except Exception:
              report["reason"] = "unexpected_client_error"

          report_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"provider_state={report['provider_state']}\n")
              output_file.write(f"instance_running={'true' if should_ssh else 'false'}\n")
          print(
              "Provider status checked; state="
              f"{report['provider_state']}; remote SSH required={'yes' if should_ssh else 'no'}."
          )
          if not report["ok"]:
              sys.exit(1)
          PY

      - name: Attach an ephemeral key and read the bounded remote probe
        id: remote
        if: steps.status.outputs.instance_running == 'true'
        shell: bash
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_INSTANCE_ID: ${{ vars.VAST_INSTANCE_ID }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/vast_probe_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_probe_known_hosts"
          instances_file="${RUNNER_TEMP}/vast-instances.json"
          connection_file="${RUNNER_TEMP}/vast-probe-connection.json"
          remote_script="${RUNNER_TEMP}/vast-probe-remote.sh"
          remote_report="${RUNNER_TEMP}/vast-probe-remote-report.json"
          trap 'rm -f "$key_file" "$key_file.pub" "$known_hosts" "$remote_script" "$instances_file" "$connection_file"' EXIT
          ssh-keygen -q -t ed25519 -N "" -C "codex-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -f "$key_file"
          public_key="$(cat "$key_file.pub")"
          request="$(jq -cn --arg ssh_key "$public_key" '{ssh_key:$ssh_key}')"
          curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${VAST_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "$request" \
            --output /dev/null \
            "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/ssh"
          host="$(jq -er '.host | select(type=="string")' "$connection_file")"
          port="$(jq -er '.port | tostring | select(test("^[0-9]+$"))' "$connection_file")"
          [[ "$host" =~ ^[0-9.]+$ ]] || { echo "Invalid SSH address returned for the fixed instance." >&2; exit 1; }
          [[ "$port" =~ ^[0-9]+$ ]] || { echo "Invalid SSH port returned for the fixed instance." >&2; exit 1; }
          key_blob="$(awk '{print $2}' "$key_file.pub")"
          ssh_opts=(-i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          ready=false
          for attempt in {1..12}; do
            if ssh "${ssh_opts[@]}" "root@${host}" true >/dev/null 2>"${RUNNER_TEMP}/vast-probe-ssh.err"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            echo "SSH did not become available; no instance state change was attempted." >&2
            exit 1
          fi
          cat > "$remote_script" <<'REMOTE'
          set -euo pipefail
          key_blob="$1"
          authorized=/root/.ssh/authorized_keys
          cleanup() {
            if [[ -f "$authorized" ]]; then
              temp="${authorized}.codex-probe.$$"
              awk -v key="$key_blob" '{keep=1; for (i=1; i<=NF; i++) if ($i==key) keep=0; if (keep) print}' "$authorized" > "$temp" || return 0
              chmod --reference="$authorized" "$temp" 2>/dev/null || chmod 600 "$temp"
              chown --reference="$authorized" "$temp" 2>/dev/null || true
              mv "$temp" "$authorized"
            fi
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path

          workspace = Path("/workspace/cnot103-full3060")
          markers = ("cnot103", "longrun-v84")
          process_count = 0
          for cmdline_path in Path("/proc").glob("[0-9]*/cmdline"):
              try:
                  cmdline = cmdline_path.read_bytes().replace(b"\0", b" ").decode("utf-8", errors="ignore").lower()
              except OSError:
                  continue
              if any(marker in cmdline for marker in markers):
                  process_count += 1
          result = {
              "remote_read": "completed",
              "workspace_present": workspace.is_dir(),
              "project_process_count": process_count,
          }
          print(json.dumps(result, separators=(",", ":")))
          PY
          REMOTE
          if ! ssh "${ssh_opts[@]}" "root@${host}" "bash -s -- ${key_blob}" \
            < "$remote_script" > "$remote_report" 2>"${RUNNER_TEMP}/vast-probe-ssh.err"; then
            echo "The bounded remote probe failed; command output was not published." >&2
            exit 1
          fi
          python3 - "$remote_report" "$GITHUB_WORKSPACE/vast-probe-remote-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          source, target = map(Path, sys.argv[1:])
          result = json.loads(source.read_text(encoding="utf-8"))
          allowed = {"remote_read", "workspace_present", "project_process_count"}
          if not isinstance(result, dict) or set(result) != allowed:
              raise SystemExit("Unexpected sanitized probe response")
          target.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Finalize the redacted report
        if: always()
        shell: bash
        env:
          STATUS_OUTCOME: ${{ steps.status.outcome }}
          INSTANCE_RUNNING: ${{ steps.status.outputs.instance_running }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["GITHUB_WORKSPACE"]) / "vast-probe-report.json"
          remote_path = Path(os.environ["GITHUB_WORKSPACE"]) / "vast-probe-remote-report.json"
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding="utf-8"))
          else:
              report = {"provider_state": "not_checked", "remote_read": "not_run", "reason": "preflight_failed", "ok": False}
          if os.environ.get("STATUS_OUTCOME") == "success":
              if os.environ.get("INSTANCE_RUNNING") != "true":
                  report["remote_read"] = "skipped_instance_not_running"
                  report["ssh_attempted"] = False
                  report["ok"] = True
              elif remote_path.is_file():
                  remote = json.loads(remote_path.read_text(encoding="utf-8"))
                  report.update(remote)
                  report["ssh_attempted"] = True
                  report["ok"] = os.environ.get("REMOTE_OUTCOME") == "success"
                  if not report["ok"]:
                      report["remote_read"] = "failed"
                      report["reason"] = "remote_probe_failed"
              else:
                  report["ssh_attempted"] = True
                  report["remote_read"] = "failed"
                  report["reason"] = "remote_probe_failed"
                  report["ok"] = False
          report_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          summary = (
              "## Vast guarded remote probe\n\n"
              f"- Provider state: `{report.get('provider_state', 'not_checked')}`\n"
              f"- Remote read: `{report.get('remote_read', 'not_run')}`\n"
              f"- Workspace present: `{report.get('workspace_present', 'not_checked')}`\n"
              f"- Project process count: `{report.get('project_process_count', 'not_checked')}`\n"
              f"- SSH attempted: `{report.get('ssh_attempted', False)}`\n"
              "- Vast mutation: `none`\n"
              "- Raw command output and logs: `not published`\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(
              "Guarded probe finalized; state="
              f"{report.get('provider_state', 'not_checked')}; "
              f"remote_read={report.get('remote_read', 'not_run')}; "
              f"SSH attempted={report.get('ssh_attempted', False)}."
          )
          PY

      - name: Save the redacted probe report in Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vast-guarded-probe-${{ steps.status.outputs.provider_state }}-ssh-${{ steps.status.outputs.instance_running }}-${{ github.run_id }}
          path: ${{ github.workspace }}/vast-probe-report.json
          if-no-files-found: warn
          retention-days: 7