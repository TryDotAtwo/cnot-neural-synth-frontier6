name: CNOT compiled CPU runtime, resume, and profile parser

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      checked_sha:
        description: Exact source commit checked by this reusable workflow
        value: ${{ jobs.cpu-torch.outputs.checked_sha }}
  push:
    branches:
      - codex/full-feature-train-workflow
    paths:
      - '.github/workflows/check-full-training-cpu-runtime.yml'
      - '.github/scripts/cnot_cpu_torch_ci.py'
      - '.github/scripts/cnot_hamming_cpu_ci.py'
      - '.github/scripts/build_training_manifest.py'
      - '.github/training-profiles/**'
      - 'native/**'
      - Cargo.lock
      - Cargo.toml

permissions:
  contents: read

jobs:
  cpu-torch:
    outputs:
      checked_sha: ${{ steps.source_revision.outputs.checked_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIBTORCH_USE_PYTORCH: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify the checked-out source commit
        id: source_revision
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "checked_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo 'source_revision=stale'
            exit 1
          fi
          echo 'source_revision=matched'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install the pinned CPU PyTorch runtime for tch 0.22
        id: torch
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/cnot103-torch-install.log"
          if ! python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.0' >"$install_log" 2>&1; then
            echo 'torch_install=failed'
            exit 1
          fi
          torch_lib="$(python3 -c 'import pathlib, torch; print(pathlib.Path(torch.__file__).resolve().parent / "lib")')"
          if ! python3 -c 'import torch; assert torch.__version__.split("+")[0] == "2.9.0" and torch.version.cuda is None'; then
            echo 'torch_install=version_or_device_mismatch'
            exit 1
          fi
          if [ ! -f "$torch_lib/libtorch_cpu.so" ]; then
            echo 'torch_install=cpu_library_missing'
            exit 1
          fi
          echo "LD_LIBRARY_PATH=$torch_lib" >>"$GITHUB_ENV"
          echo "status=success" >>"$GITHUB_OUTPUT"
          echo 'torch_install=success'

      - name: Compile the v13 CPU runtime test binary
        id: compile_v13
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          cargo_json="$RUNNER_TEMP/cnot103-v13-cargo.json"
          binary_file="$RUNNER_TEMP/cnot103-v13-executable"
          cargo_status=0
          cargo test --no-run --locked --features torch --lib --message-format=json >"$cargo_json" 2>&1 || cargo_status=$?
          python3 ../.github/scripts/cnot_cpu_torch_ci.py compile \
            --cargo-json "$cargo_json" --cargo-exit "$cargo_status" \
            --artifact-kind lib_test --binary-file "$binary_file" \
            --artifact-dir "$RUNNER_TEMP/cnot103-torch-target/debug/deps" \
            --artifact-prefix cnot103_native- --allow-missing-executable --expected-test device_search::runtime::tests::v13_budget_is_charged_before_nearest_and_identity_depth_rules_hold --output "$GITHUB_OUTPUT"

      - name: Run the named v13 runtime regressions on CPU tensors
        id: v13
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          python3 ../.github/scripts/cnot_cpu_torch_ci.py run-cargo-tests \
            --manifest-path Cargo.toml --cwd "$GITHUB_WORKSPACE/native" \
            --filter device_search::runtime::tests:: \
            --tests \
              device_search::runtime::tests::v13_budget_is_charged_before_nearest_and_identity_depth_rules_hold \
              device_search::runtime::tests::v13_terminal_scans_all_gates_even_when_shortlist_omits_the_solution \
              device_search::runtime::tests::v13_depth_three_budget_matches_scalar_oracle_at_seven_and_forty_three \
              device_search::runtime::tests::v13_saturated_frontier_is_all_or_none_at_one_plus_b_minus_one_and_one_plus_b \
              device_search::runtime::tests::compiled_cpu_runtime_matches_small_gl2_bfs_distances_and_replays \
              device_search::runtime::tests::compiled_cpu_runtime_matches_209_pinned_v13_cases_and_scalar_oracle \
              device_search::runtime::tests::cpu_hamming_baseline_runs_through_the_same_search_runtime_and_replays \
            --output "$GITHUB_OUTPUT"

      - name: Check K4 Bellman sampling and exact-minimum gap on synthetic CPU tensors
        id: bellman_audit
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          cargo test --locked --features torch --lib bellman::audit::tests:: -- --nocapture

      - name: Verify the 102-feature and missing-status model input ABI
        id: model_input_contract
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          cargo test --locked --features torch --test feature_schema model_input_contract_has_102_slots_and_h07_stays_post_forward -- --exact

      - name: Compile the fresh-process resume test binary
        id: compile_resume
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          cargo_json="$RUNNER_TEMP/cnot103-resume-cargo.json"
          binary_file="$RUNNER_TEMP/cnot103-resume-executable"
          cargo_status=0
          cargo test --no-run --locked --features torch --test tch_training_resume --message-format=json >"$cargo_json" 2>&1 || cargo_status=$?
          python3 ../.github/scripts/cnot_cpu_torch_ci.py compile \
            --cargo-json "$cargo_json" --cargo-exit "$cargo_status" \
            --artifact-kind test --target-name tch_training_resume \
            --binary-file "$binary_file" \
            --artifact-dir "$RUNNER_TEMP/cnot103-torch-target/debug/deps" \
            --artifact-prefix tch_training_resume- --output "$GITHUB_OUTPUT"

      - name: Run the named fresh-process resume regressions
        id: resume
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          python3 ../.github/scripts/cnot_cpu_torch_ci.py run-tests \
            --binary-file "$RUNNER_TEMP/cnot103-resume-executable" \
            --tests fresh_process_resume_matches_uninterrupted \
              finite_loss_with_overflowing_adam_moments_requires_restore \
            --output "$GITHUB_OUTPUT"

      - name: Compile the real Rust manifest validator
        id: compile_profile
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          cargo_json="$RUNNER_TEMP/cnot103-profile-cargo.json"
          binary_file="$RUNNER_TEMP/cnot103-profile-executable"
          cargo_status=0
          cargo build --locked --features torch --bin cnot103-validate-manifest --message-format=json >"$cargo_json" 2>&1 || cargo_status=$?
          python3 ../.github/scripts/cnot_cpu_torch_ci.py compile \
            --cargo-json "$cargo_json" --cargo-exit "$cargo_status" \
            --artifact-kind bin --target-name cnot103-validate-manifest \
            --binary-file "$binary_file" --output "$GITHUB_OUTPUT"

      - name: Validate the pinned 102-input profile with the real Rust parser
        id: profile
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          profile_status=failed
          profile_code=parser_validation_failed
          binary_file="$RUNNER_TEMP/cnot103-profile-executable"
          if [ ! -f "$binary_file" ]; then
            profile_code=compiled_binary_missing
          else
            validator="$(cat "$binary_file")"
            dataset="$RUNNER_TEMP/cnot103-parser-fixture.json"
            manifest="$RUNNER_TEMP/cnot103-valid-manifest.json"
            invalid="$RUNNER_TEMP/cnot103-invalid-manifest.json"
            printf '%s' '{"schema":"cnot103_parser_smoke","records":[]}' >"$dataset"
            dataset_sha="$(sha256sum "$dataset" | cut -d ' ' -f 1)"
            if python3 ../.github/scripts/build_training_manifest.py \
              --profile ../.github/training-profiles/n10-test-support-v1.json \
              --dataset-path "$dataset" \
              --dataset-sha256 "$dataset_sha" \
              --checkpoint-dir "$RUNNER_TEMP/cnot103-checkpoints" \
              --attempts 1 --target-attempts 1 \
              --output "$manifest" >"$RUNNER_TEMP/cnot103-manifest-builder.log" 2>&1; then
              if "$validator" "$manifest" >"$RUNNER_TEMP/cnot103-manifest-valid.log" 2>&1 \
                && grep -Fq 'manifest_profile=valid' "$RUNNER_TEMP/cnot103-manifest-valid.log" \
                && grep -Fq 'model_input_slots=102' "$RUNNER_TEMP/cnot103-manifest-valid.log"; then
                python3 - "$manifest" "$invalid" <<'PY'
          import json
          import sys
          source, target = sys.argv[1], sys.argv[2]
          with open(source, encoding="utf-8") as stream:
              value = json.load(stream)
          value["feature_policy"]["schema_id"] = ""
          with open(target, "w", encoding="utf-8") as stream:
              json.dump(value, stream)
          PY
                if ! "$validator" "$invalid" >"$RUNNER_TEMP/cnot103-manifest-invalid.log" 2>&1; then
                  profile_status=passed
                  profile_code=none
                fi
              fi
            fi
          fi
          echo "status=$profile_status" >>"$GITHUB_OUTPUT"
          echo "code=$profile_code" >>"$GITHUB_OUTPUT"
          echo "profile_status=$profile_status profile_code=$profile_code"

      - name: Compile the sealed Hamming fixture writer
        id: compile_hamming_fixture
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          cargo_json="$RUNNER_TEMP/cnot103-hamming-fixture-cargo.json"
          binary_file="$RUNNER_TEMP/cnot103-hamming-fixture-executable"
          cargo_status=0
          cargo test --no-run --locked --features torch --test cnot_hamming_fixture --message-format=json >"$cargo_json" 2>&1 || cargo_status=$?
          python3 ../.github/scripts/cnot_cpu_torch_ci.py compile \
            --cargo-json "$cargo_json" --cargo-exit "$cargo_status" \
            --artifact-kind test --target-name cnot_hamming_fixture \
            --binary-file "$binary_file" \
            --artifact-dir "$RUNNER_TEMP/cnot103-torch-target/debug/deps" \
            --artifact-prefix cnot_hamming_fixture- --output "$GITHUB_OUTPUT"

      - name: Write the sealed synthetic train dev test fixture
        id: hamming_fixture
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' && steps.compile_hamming_fixture.outputs.status == 'compiled' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
          CNOT103_TEST_FIXTURE_PATH: ${{ runner.temp }}/cnot103-hamming-fixture.json
        run: |
          set -euo pipefail
          python3 ../.github/scripts/cnot_cpu_torch_ci.py run-tests \
            --binary-file "$RUNNER_TEMP/cnot103-hamming-fixture-executable" \
            --tests export_cpu_hamming_fixture_for_ci --output "$GITHUB_OUTPUT"

      - name: Compile CPU-only Hamming search binary
        id: compile_hamming
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' }}
        working-directory: native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-torch-target
        run: |
          set -euo pipefail
          cargo_json="$RUNNER_TEMP/cnot103-hamming-cargo.json"
          binary_file="$RUNNER_TEMP/cnot103-hamming-executable"
          cargo_status=0
          cargo build --locked --features torch --bin cnot103-hamming-search --message-format=json >"$cargo_json" 2>&1 || cargo_status=$?
          python3 ../.github/scripts/cnot_cpu_torch_ci.py compile \
            --cargo-json "$cargo_json" --cargo-exit "$cargo_status" \
            --artifact-kind bin --target-name cnot103-hamming-search \
            --binary-file "$binary_file" --output "$GITHUB_OUTPUT"

      - name: Run pinned CPU Hamming search and reject altered dataset roots
        id: hamming
        if: ${{ always() && !cancelled() && steps.torch.outcome == 'success' && steps.compile_hamming_fixture.outputs.status == 'compiled' && steps.hamming_fixture.outputs.status == 'passed' && steps.compile_hamming.outputs.status == 'compiled' }}
        env:
          CNOT103_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/cnot_hamming_cpu_ci.py \
            --dataset "$RUNNER_TEMP/cnot103-hamming-fixture.json" \
            --binary-file "$RUNNER_TEMP/cnot103-hamming-executable" \
            --source-revision "$CNOT103_SOURCE_REVISION" \
            --output "$GITHUB_OUTPUT"

      - name: Close the CPU torch acceptance gate
        if: always() && !cancelled()
        env:
          TORCH_OUTCOME: ${{ steps.torch.outcome }}
          V13_COMPILE_STATUS: ${{ steps.compile_v13.outputs.status }}
          V13_COMPILE_CODE: ${{ steps.compile_v13.outputs.rustc_code }}
          V13_STATUS: ${{ steps.v13.outputs.status }}
          V13_CODE: ${{ steps.v13.outputs.code }}
          RESUME_COMPILE_STATUS: ${{ steps.compile_resume.outputs.status }}
          RESUME_COMPILE_CODE: ${{ steps.compile_resume.outputs.rustc_code }}
          RESUME_STATUS: ${{ steps.resume.outputs.status }}
          RESUME_CODE: ${{ steps.resume.outputs.code }}
          PROFILE_COMPILE_STATUS: ${{ steps.compile_profile.outputs.status }}
          PROFILE_COMPILE_CODE: ${{ steps.compile_profile.outputs.rustc_code }}
          PROFILE_STATUS: ${{ steps.profile.outputs.status }}
          PROFILE_CODE: ${{ steps.profile.outputs.code }}
          HAMMING_FIXTURE_COMPILE_STATUS: ${{ steps.compile_hamming_fixture.outputs.status }}
          HAMMING_FIXTURE_STATUS: ${{ steps.hamming_fixture.outputs.status }}
          HAMMING_COMPILE_STATUS: ${{ steps.compile_hamming.outputs.status }}
          HAMMING_STATUS: ${{ steps.hamming.outputs.status }}
        run: |
          set -euo pipefail
          echo "v13_compile=${V13_COMPILE_STATUS:-not_run} rustc_code=${V13_COMPILE_CODE:-none}"
          echo "v13=${V13_STATUS:-not_run} code=${V13_CODE:-none}"
          echo "resume_compile=${RESUME_COMPILE_STATUS:-not_run} rustc_code=${RESUME_COMPILE_CODE:-none}"
          echo "resume=${RESUME_STATUS:-not_run} code=${RESUME_CODE:-none}"
          echo "profile_compile=${PROFILE_COMPILE_STATUS:-not_run} rustc_code=${PROFILE_COMPILE_CODE:-none}"
          echo "profile=${PROFILE_STATUS:-not_run} code=${PROFILE_CODE:-none}"
          echo "hamming_fixture_compile=${HAMMING_FIXTURE_COMPILE_STATUS:-not_run}"
          echo "hamming_fixture=${HAMMING_FIXTURE_STATUS:-not_run}"
          echo "hamming_compile=${HAMMING_COMPILE_STATUS:-not_run}"
          echo "hamming=${HAMMING_STATUS:-not_run}"
          python3 .github/scripts/cnot_cpu_torch_ci.py gate \
            --torch "${TORCH_OUTCOME:-missing}" \
            --v13-compile "${V13_COMPILE_STATUS:-not_run}" \
            --v13 "${V13_STATUS:-not_run}" \
            --resume-compile "${RESUME_COMPILE_STATUS:-not_run}" \
            --resume "${RESUME_STATUS:-not_run}" \
            --profile-compile "${PROFILE_COMPILE_STATUS:-not_run}" \
            --profile "${PROFILE_STATUS:-not_run}" \
            --hamming-fixture-compile "${HAMMING_FIXTURE_COMPILE_STATUS:-not_run}" \
            --hamming-fixture "${HAMMING_FIXTURE_STATUS:-not_run}" \
            --hamming-compile "${HAMMING_COMPILE_STATUS:-not_run}" \
            --hamming "${HAMMING_STATUS:-not_run}"
