name: Qhat4 full-gradient epoch on RTX 3060
run-name: Qhat4 full-gradient epoch and quality gates on RTX 3060
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vast-qhat4-marketplace-3060.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cnot103-vast-qhat4-marketplace-3060
  cancel-in-progress: false

jobs:
  train:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 185
    env:
      VAST_INSTANCE_ID: auto
      CNOT103_QHAT4_ROOT: /workspace/qhat4-recovery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout trainer and bounded controller
        uses: actions/checkout@v4

      - name: Parse all Python sources before contacting Vast
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = (
              ".github/scripts/vast_qhat4_market_driver.py",
              ".github/scripts/vast_qhat4_driver.py",
              ".github/scripts/train_qhat4_epoch.py",
          )
          for path in paths:
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          print("python_source_parse=pass")
          PY

      - name: Install Vast CLI
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Run budgeted RTX 3060 epoch and quality checks
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python3 .github/scripts/vast_qhat4_market_driver.py
