name: CNOT full 100-epoch training

on:
  push:
    branches:
      - codex/full-feature-train-workflow
    paths:
      - .github/paid-runs/2026-11-20-full-training.json

concurrency:
  group: cnot103-existing-2x3060-target
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  source_manifest:
    name: Required full-training manifest checks
    uses: ./.github/workflows/check-full-training-manifest.yml
    with:
      source_sha: ${{ github.sha }}

  source_cpu_runtime:
    name: Required CPU runtime, resume and profile checks
    uses: ./.github/workflows/check-full-training-cpu-runtime.yml
    with:
      source_sha: ${{ github.sha }}

  source_cuda_build:
    name: Required native CUDA build and link
    uses: ./.github/workflows/check-full-training-cuda-build.yml
    with:
      source_sha: ${{ github.sha }}

  start:
    needs: [source_manifest, source_cpu_runtime, source_cuda_build]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out the source pinned to this run
        uses: actions/checkout@v4

      - name: Discover and mask the pinned holdout metadata
        run: python3 .github/scripts/fetch_public_holdout.py --discover-current-pin

      - name: Install Vast CLI
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai==1.11.2
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Start the budget-gated full training run
        id: start_training
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          CNOT103_APPROVED_TARGET_INSTANCE_ID: ${{ secrets.CNOT103_APPROVED_TARGET_INSTANCE_ID }}
        run: python3 .github/scripts/vast_full_training_controller.py start

  monitor_1:
    needs: start
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  monitor_2:
    needs: monitor_1
    if: needs.monitor_1.outputs.status == 'running'
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  monitor_3:
    needs: monitor_2
    if: needs.monitor_2.outputs.status == 'running'
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  monitor_4:
    needs: monitor_3
    if: needs.monitor_3.outputs.status == 'running'
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  monitor_5:
    needs: monitor_4
    if: needs.monitor_4.outputs.status == 'running'
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  monitor_6:
    needs: monitor_5
    if: needs.monitor_5.outputs.status == 'running'
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  monitor_7:
    needs: monitor_6
    if: needs.monitor_6.outputs.status == 'running'
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  monitor_8:
    needs: monitor_7
    if: needs.monitor_7.outputs.status == 'running'
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  monitor_9:
    needs: monitor_8
    if: needs.monitor_8.outputs.status == 'running'
    uses: ./.github/workflows/cnot-full-training-monitor.yml
    with:
      window_seconds: 19800
    secrets: inherit

  finalize:
    if: always()
    needs:
      - source_preflight
      - start
      - monitor_1
      - monitor_2
      - monitor_3
      - monitor_4
      - monitor_5
      - monitor_6
      - monitor_7
      - monitor_8
      - monitor_9
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pinned controller source
        uses: actions/checkout@v4

      - name: Install Vast CLI
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Verify quality state and stop only the exact run target
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          CNOT103_APPROVED_TARGET_INSTANCE_ID: ${{ secrets.CNOT103_APPROVED_TARGET_INSTANCE_ID }}
        run: python3 .github/scripts/vast_full_training_controller.py cleanup
