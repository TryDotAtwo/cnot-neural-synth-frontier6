name: Read Qhat4 marketplace RTX 3060 status
run-name: Read-only Qhat4 RTX 3060 status recheck
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vast-qhat4-status-market-target.yml
      - .github/workflows/vast-qhat4-marketplace-3060.yml
      - .github/scripts/vast_qhat4_market_driver.py
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cnot103-vast-qhat4-target-status
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only probe
        uses: actions/checkout@v4

      - name: Parse probe before contacting Vast
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = ".github/scripts/vast_qhat4_status_market_target.py"
          ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          print("status_probe_parse=pass")
          PY

      - name: Install Vast CLI
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Read target status
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python3 -u .github/scripts/vast_qhat4_status_market_target.py
