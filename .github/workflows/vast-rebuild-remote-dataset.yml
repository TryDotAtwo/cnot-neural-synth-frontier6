name: Rebuild frozen 10k dataset on existing Vast disk

on:
  workflow_dispatch:
    inputs:
      holdout_revision:
        description: Exact Hugging Face dataset commit SHA
        required: true
        type: string
      holdout_sha256:
        description: SHA-256 of the pinned holdout SQLite artifact
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tqp-remote-dataset-rebuild
  cancel-in-progress: false

jobs:
  rebuild-and-validate:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out controller source
        uses: actions/checkout@v4

      - name: Check controller syntax
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/vast_rebuild_remote_dataset.py').read_text(encoding='utf-8'))"
      - name: Install Vast CLI for the total-spend gate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Verify pinned holdout metadata before Vast access
        env:
          CNOT103_HOLDOUT_REVISION: ${{ inputs.holdout_revision }}
          CNOT103_HOLDOUT_SHA256: ${{ inputs.holdout_sha256 }}
        run: python3 .github/scripts/fetch_public_holdout.py --metadata-check --expected-revision "$CNOT103_HOLDOUT_REVISION" --expected-sha256 "$CNOT103_HOLDOUT_SHA256"

      - name: Rebuild and validate only on the existing running 2x3060 target
        timeout-minutes: 140
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          CNOT103_HOLDOUT_REVISION: ${{ inputs.holdout_revision }}
          CNOT103_HOLDOUT_SHA256: ${{ inputs.holdout_sha256 }}
        run: python3 .github/scripts/vast_rebuild_remote_dataset.py
