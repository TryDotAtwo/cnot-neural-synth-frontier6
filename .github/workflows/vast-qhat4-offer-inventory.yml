name: Qhat4 RTX 3060 offer inventory
run-name: Read-only RTX 3060 capacity and budget gate
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vast-qhat4-offer-inventory.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cnot103-vast-qhat4-offer-inventory
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Install Vast CLI
        run: |
          set -euo pipefail
          cli_venv="${RUNNER_TEMP}/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Read current charges and RTX 3060 offer cohorts
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          def cli_json(args):
              proc = subprocess.run(
                  ['vastai', '--api-key', os.environ['VAST_API_KEY'], *args, '--raw'],
                  check=False, capture_output=True, text=True, timeout=90,
              )
              if proc.returncode:
                  raise RuntimeError('vast_query_failed')
              return json.loads(proc.stdout)

          sys.path.insert(0, '.github/scripts')
          from vast_qhat4_driver import project_charges

          spent = project_charges()
          rows = cli_json([
              'search', 'offers', 'gpu_name=RTX_3060 num_gpus=1',
              '--order=dph_total', '--limit=100',
          ])
          if isinstance(rows, dict):
              rows = rows.get('offers', rows.get('results'))
          if not isinstance(rows, list):
              raise RuntimeError('offer_shape_invalid')

          def numeric(value):
              if isinstance(value, bool) or value is None:
                  return None
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def truth(value):
              return value is True or value == 1 or (isinstance(value, str) and value.casefold() == 'true')

          candidates = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              name = str(row.get('gpu_name', '')).casefold().replace(' ', '').replace('_', '')
              ngpu = numeric(row.get('num_gpus'))
              if 'rtx' not in name or '3060' not in name or ngpu != 1:
                  continue
              ram = numeric(row.get('gpu_ram'))
              cc = numeric(row.get('compute_cap'))
              reliability = numeric(row.get('reliability'))
              rate = numeric(row.get('dph_total'))
              ports = numeric(row.get('direct_port_count'))
              if (ram is None or ram < 12000 or cc is None or cc < 8.6
                      or reliability is None or reliability < 0.95
                      or not truth(row.get('verified')) or not truth(row.get('rentable'))
                      or rate is None or rate <= 0 or ports is None or ports < 1):
                  continue
              if spent + 3.5 * rate + 5.0 < 20.0:
                  candidates.append(rate)

          print('offer_inventory=complete')
          print(f'rtx3060_single_gpu_rows={sum(1 for r in rows if isinstance(r, dict) and "3060" in str(r.get("gpu_name", "")).casefold() and numeric(r.get("num_gpus")) == 1)}')
          print(f'eligible_12gb_verified_reliable_direct_offers={len(candidates)}')
          if candidates:
              print(f'lowest_eligible_total_usd_per_hour={min(candidates):.4f}')
              print('budget_gate=pass runtime_reserve_hours=3.5 transfer_reserve_usd=5.00')
          else:
              print('budget_gate=no_eligible_offer_under_cap')
          PY
