name: Qhat4 RTX 3060 offer inventory
run-name: Read-only RTX 3060 capacity and budget gate
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vast-qhat4-offer-inventory.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cnot103-vast-qhat4-offer-inventory
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Install Vast CLI
        run: |
          set -euo pipefail
          cli_venv="${RUNNER_TEMP}/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Read current charges and RTX 3060 offer cohorts
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          def cli_json(args):
              proc = subprocess.run(
                  ['vastai', '--api-key', os.environ['VAST_API_KEY'], *args, '--raw'],
                  check=False, capture_output=True, text=True, timeout=90,
              )
              if proc.returncode:
                  raise RuntimeError('vast_query_failed')
              return json.loads(proc.stdout)

          def offer_rows(query):
              rows = cli_json(['search', 'offers', query, '--order=dph_total', '--limit=100'])
              if isinstance(rows, dict):
                  rows = rows.get('offers', rows.get('results'))
              if not isinstance(rows, list):
                  raise RuntimeError('offer_shape_invalid')
              return rows

          sys.path.insert(0, '.github/scripts')
          from vast_qhat4_driver import project_charges

          spent = project_charges()
          instances = cli_json(['show', 'instances'])
          if not isinstance(instances, list):
              raise RuntimeError('instance_shape_invalid')
          for role, ident, labels in (
              ('source', 61081857, {'cnot103-longrun-original-3060-v84', 'cnot103-longrun-original-3060-v84-r2'}),
              ('fallback', 60932086, {'cnot103-original-full-rtx3060-20261116-v3'}),
          ):
              matches = [x for x in instances if isinstance(x, dict) and str(x.get('id')) == str(ident) and x.get('label') in labels]
              detail = cli_json(['show', 'instance', str(ident)])
              if isinstance(detail, list) and len(detail) == 1:
                  detail = detail[0]
              row = dict(matches[0]) if len(matches) == 1 else {}
              if isinstance(detail, dict):
                  row.update(detail)
              print(f'{role}_instance_metadata_found={str(bool(row)).lower()}')
              image = row.get('image') or row.get('docker_image') or row.get('image_name') or row.get('container_image')
              if isinstance(image, str) and image and all(c.isalnum() or c in '._/@:-' for c in image):
                  print(f'{role}_docker_image={image}')
              else:
                  print(f'{role}_docker_image=unavailable')
              template = row.get('template_hash_id')
              if isinstance(template, str) and template and all(c.isalnum() or c in '._-' for c in template):
                  print(f'{role}_template_hash={template}')
          rows = offer_rows('gpu_name=RTX_3060 num_gpus=1')
          verified_rows = offer_rows('gpu_name=RTX_3060 num_gpus=1 verified=true')

          def numeric(value):
              if isinstance(value, bool) or value is None:
                  return None
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def truth(value):
              return value is True or value == 1 or (isinstance(value, str) and value.casefold() == 'true')

          single = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              name = str(row.get('gpu_name', '')).casefold().replace(' ', '').replace('_', '')
              if 'rtx' in name and '3060' in name and numeric(row.get('num_gpus')) == 1:
                  single.append(row)

          hardware_rates = []
          budget_rates = []
          for row in single:
              ram = numeric(row.get('gpu_ram'))
              cc = numeric(row.get('compute_cap'))
              reliability = numeric(row.get('reliability'))
              rate = numeric(row.get('dph_total'))
              ports = numeric(row.get('direct_port_count'))
              hardware_ok = (
                  ram is not None and ram >= 12000
                  and cc is not None and cc >= 8.6
                  and reliability is not None and reliability >= 0.95
                  and truth(row.get('rentable'))
                  and ports is not None and ports >= 1
                  and rate is not None and rate > 0
              )
              if hardware_ok:
                  hardware_rates.append(rate)
                  if spent + 3.5 * rate + 5.0 < 20.0:
                      budget_rates.append(rate)

          print('offer_inventory=complete')
          print(f'rtx3060_single_gpu_rows={len(single)}')
          print(f'explicit_verified_search_rows={len(verified_rows)}')
          print(f'12gb_cc86_reliable_rentable_ssh_rows={len(hardware_rates)}')
          print(f'within_budget_rows={len(budget_rates)}')
          if hardware_rates:
              print(f'lowest_hardware_eligible_total_usd_per_hour={min(hardware_rates):.4f}')
          if budget_rates:
              print(f'lowest_within_budget_total_usd_per_hour={min(budget_rates):.4f}')
              print('budget_gate=pass runtime_reserve_hours=3.5 transfer_reserve_usd=5.00')
          else:
              print('budget_gate=no_hardware_eligible_offer_under_cap')
          PY
