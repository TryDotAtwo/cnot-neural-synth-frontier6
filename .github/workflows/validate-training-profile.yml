name: Validate pinned CNOT training feature profile
run-name: Validate the pinned CNOT feature-context profile

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/training-profiles/*.json
      - .github/workflows/validate-training-profile.yml

permissions:
  contents: read

concurrency:
  group: tqp-training-profile-validation
  cancel-in-progress: true

jobs:
  validate-profile:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate pinned profile and build a non-published manifest
        run: |
          set -euo pipefail
          python3 .github/scripts/build_training_manifest.py \
            --profile .github/training-profiles/n10-test-support-v1.json \
            --dataset-path /workspace/profile-check/frozen_train_10k.json \
            --dataset-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --checkpoint-dir /workspace/profile-check/checkpoints \
            --output "$RUNNER_TEMP/cnot103-training-profile-manifest.json"

      - name: Set up Rust for CPU-only manifest validation
        uses: dtolnay/rust-toolchain@stable

      - name: Validate the profile with the Rust manifest parser
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-profile-target
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys

          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cnot103-training-profile-manifest.json"
          validator = pathlib.Path(os.environ["CARGO_TARGET_DIR"]) / "debug" / "cnot103-validate-manifest"
          command = [
              "cargo", "run", "--quiet", "--manifest-path", "native/Cargo.toml",
              "--no-default-features", "--bin", "cnot103-validate-manifest", "--", str(output),
          ]
          try:
              result = subprocess.run(command, capture_output=True, text=True, timeout=480, check=False)
          except FileNotFoundError:
              print("manifest_profile=invalid")
              print("manifest_failure_class=cargo_unavailable")
              raise SystemExit(1)
          except subprocess.TimeoutExpired:
              print("manifest_profile=invalid")
              print("manifest_failure_class=rust_build_timeout")
              raise SystemExit(1)

          if result.returncode != 0:
              if "manifest validation failed: invalid run manifest" in result.stderr:
                  failure = "manifest_parse_rejected"
              elif "manifest validation failed: feature profile incomplete or invalid" in result.stderr:
                  failure = "feature_profile_rejected"
              elif not validator.is_file():
                  failure = "rust_build_failed"
              else:
                  failure = "validator_failed"
              print("manifest_profile=invalid")
              print(f"manifest_failure_class={failure}")
              raise SystemExit(1)

          values = set(result.stdout.splitlines())
          if not {"manifest_profile=valid", "model_input_slots=102"}.issubset(values):
              print("manifest_profile=invalid")
              print("manifest_failure_class=validator_output_mismatch")
              raise SystemExit(1)

          print("manifest_profile=valid")
          print("model_input_slots=102")
          PY
