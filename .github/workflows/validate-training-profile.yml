name: Validate pinned CNOT training feature profile
run-name: Validate the pinned CNOT feature-context profile

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/training-profiles/*.json
      - .github/workflows/validate-training-profile.yml

permissions:
  contents: read

concurrency:
  group: tqp-training-profile-validation
  cancel-in-progress: true

jobs:
  validate-profile:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate pinned profile and build a non-published manifest
        run: |
          set -euo pipefail
          python3 .github/scripts/build_training_manifest.py \
            --profile .github/training-profiles/n10-test-support-v1.json \
            --dataset-path /workspace/profile-check/frozen_train_10k.json \
            --dataset-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --checkpoint-dir /workspace/profile-check/checkpoints \
            --output "$RUNNER_TEMP/cnot103-training-profile-manifest.json"

      - name: Set up Rust for CPU-only manifest validation
        uses: dtolnay/rust-toolchain@stable

      - name: Validate the profile with the Rust manifest parser
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-profile-target
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            printf '%s\\n' 'manifest_profile=invalid' 'manifest_failure_class=cargo_unavailable'
            exit 1
          fi
          set +e
          cargo run --quiet --manifest-path native/Cargo.toml --no-default-features \
            --bin cnot103-validate-manifest -- "$RUNNER_TEMP/cnot103-training-profile-manifest.json" \
            >"$RUNNER_TEMP/cnot103-profile-validator.stdout" \
            2>"$RUNNER_TEMP/cnot103-profile-validator.stderr"
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            if grep -Fq 'manifest validation failed: invalid run manifest' "$RUNNER_TEMP/cnot103-profile-validator.stderr"; then
              failure_class=manifest_parse_rejected
            elif grep -Fq 'manifest validation failed: feature profile incomplete or invalid' "$RUNNER_TEMP/cnot103-profile-validator.stderr"; then
              failure_class=feature_profile_rejected
            elif grep -Eq 'error:|could not compile|failed to download' "$RUNNER_TEMP/cnot103-profile-validator.stderr"; then
              failure_class=rust_build_failed
            else
              failure_class=validator_failed
            fi
            printf '%s\\n' 'manifest_profile=invalid' "manifest_failure_class=$failure_class"
            exit 1
          fi
          if ! grep -qx 'manifest_profile=valid' "$RUNNER_TEMP/cnot103-profile-validator.stdout" || ! grep -qx 'model_input_slots=102' "$RUNNER_TEMP/cnot103-profile-validator.stdout"; then
            printf '%s\\n' 'manifest_profile=invalid' 'manifest_failure_class=validator_output_mismatch'
            exit 1
          fi
          printf '%s\\n' 'manifest_profile=valid' 'model_input_slots=102'
