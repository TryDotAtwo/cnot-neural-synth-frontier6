name: Validate pinned CNOT training feature profile
run-name: Validate the pinned CNOT feature-context profile

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/training-profiles/*.json
      - .github/workflows/validate-training-profile.yml

permissions:
  contents: read

concurrency:
  group: tqp-training-profile-validation
  cancel-in-progress: true

jobs:
  validate-profile:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate pinned profile and build a non-published manifest
        run: |
          set -euo pipefail
          python3 .github/scripts/build_training_manifest.py \
            --profile .github/training-profiles/n10-test-support-v1.json \
            --dataset-path /workspace/profile-check/frozen_train_10k.json \
            --dataset-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --checkpoint-dir /workspace/profile-check/checkpoints \
            --output "$RUNNER_TEMP/cnot103-training-profile-manifest.json"

      - name: Set up Rust for CPU-only manifest validation
        uses: dtolnay/rust-toolchain@stable

      - name: Validate the profile with the Rust manifest parser
        run: |
          set -euo pipefail
          cargo_home="$(dirname "$(dirname "$(command -v cargo)")")"
          rustup_home="$(rustup show home)"
          if ! docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace/project" \
            --volume "$RUNNER_TEMP:/runner_temp" \
            --volume "$cargo_home:/root/.cargo" \
            --volume "$rustup_home:/root/.rustup" \
            --workdir /workspace/project/native \
            --env CARGO_HOME=/root/.cargo \
            --env RUSTUP_HOME=/root/.rustup \
            --env PATH=/root/.cargo/bin:/usr/local/cuda/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env CARGO_TARGET_DIR=/runner_temp/cnot103-profile-target \
            --env CNOT103_CUDA_ARCHITECTURES=86 \
            --env CUDA_HOME=/usr/local/cuda \
            --env LIBTORCH_USE_PYTORCH=1 \
            --env LD_LIBRARY_PATH=/opt/conda/lib/python3.11/site-packages/torch/lib:/usr/local/cuda/lib64 \
            pytorch/pytorch:2.9.0-cuda12.8-cudnn9-devel \
            bash -euc '/root/.cargo/bin/cargo run --quiet --features cuda --bin cnot103-validate-manifest -- /runner_temp/cnot103-training-profile-manifest.json' \
            >"$RUNNER_TEMP/cnot103-profile-docker.stdout" \
            2>"$RUNNER_TEMP/cnot103-profile-docker.stderr"; then
            if grep -Fq 'manifest validation failed: invalid run manifest' "$RUNNER_TEMP/cnot103-profile-docker.stderr"; then
              echo 'manifest_profile=invalid'
              echo 'manifest_failure_class=manifest_parse_rejected'
            elif grep -Fq 'manifest validation failed: feature profile incomplete or invalid' "$RUNNER_TEMP/cnot103-profile-docker.stderr"; then
              echo 'manifest_profile=invalid'
              echo 'manifest_failure_class=feature_profile_rejected'
            elif grep -Eq 'Unable to find image|pull access denied|Cannot connect to the Docker daemon' "$RUNNER_TEMP/cnot103-profile-docker.stderr"; then
              echo 'manifest_profile=invalid'
              echo 'manifest_failure_class=cuda_container_unavailable'
            else
              echo 'manifest_profile=invalid'
              echo 'manifest_failure_class=cuda_validator_failed'
            fi
            exit 1
          fi
          if ! grep -qx 'manifest_profile=valid' "$RUNNER_TEMP/cnot103-profile-docker.stdout" || ! grep -qx 'model_input_slots=102' "$RUNNER_TEMP/cnot103-profile-docker.stdout"; then
            echo 'manifest_profile=invalid'
            echo 'manifest_failure_class=validator_output_mismatch'
            exit 1
          fi
          echo 'manifest_profile=valid'
          echo 'model_input_slots=102'
