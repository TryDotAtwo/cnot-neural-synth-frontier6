name: CNOT full-training monitor window

on:
  workflow_call:
    inputs:
      window_seconds:
        required: true
        type: number
    outputs:
      status:
        description: Allowlisted monitor state
        value: ${{ jobs.monitor.outputs.status }}
      stop_verification:
        description: Exact-target stop readback state
        value: ${{ jobs.monitor.outputs.stop_verification }}

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      status: ${{ steps.monitor.outputs.status }}
      stop_verification: ${{ steps.monitor.outputs.stop_verification }}
    steps:
      - name: Check out the pinned controller source
        uses: actions/checkout@v4

      - name: Install Vast CLI
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Monitor one bounded window
        id: monitor
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          CNOT103_APPROVED_TARGET_INSTANCE_ID: ${{ secrets.CNOT103_APPROVED_TARGET_INSTANCE_ID }}
        run: python3 .github/scripts/vast_full_training_controller.py monitor --window-seconds "${{ inputs.window_seconds }}"
