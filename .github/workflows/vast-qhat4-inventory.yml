name: Read-only redacted Vast project inventory
run-name: Redacted Vast inventory check
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vast-qhat4-inventory.yml
      - .github/scripts/vast_qhat4_inventory.py
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cnot103-vast-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout redacted inventory probe
        uses: actions/checkout@v4

      - name: Parse before contacting Vast
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = ".github/scripts/vast_qhat4_inventory.py"
          ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          print("inventory_probe_parse=pass")
          PY

      - name: Install Vast CLI
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Read redacted project inventory
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python3 -u .github/scripts/vast_qhat4_inventory.py
