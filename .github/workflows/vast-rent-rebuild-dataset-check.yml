name: 2x3060 dataset controller source checks

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/scripts/vast_rent_rebuild_dataset.py
      - .github/scripts/vast_probe_existing_2x3060.py
      - .github/scripts/test_vast_rent_rebuild_dataset.py
      - .github/workflows/vast-rent-rebuild-dataset-check.yml

permissions:
  contents: read

concurrency:
  group: tqp-rent-rebuild-controller-check
  cancel-in-progress: false

jobs:
  controller-tests:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controller source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run controller unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_vast_rent_rebuild_dataset.py' -v

      - name: Parse controller and tests
        run: python3 -c "import ast, pathlib; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8')) for p in ('.github/scripts/vast_rent_rebuild_dataset.py', '.github/scripts/test_vast_rent_rebuild_dataset.py')]"
