name: Authorized 2x3060 frozen 10k rebuild
run-name: One-shot 2x3060 dataset rebuild (wait for stop)

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/paid-runs/2026-11-20-rebuild-10k.json

permissions:
  contents: read
  statuses: write

concurrency:
  group: tqp-authorized-2x3060-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Publish redacted run-start status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "CNOT 2x3060 dataset rebuild",
              description: "running",
            });

      - name: Check out source pinned to this run
        uses: actions/checkout@v4

      - name: Discover and pin current holdout metadata before Vast access
        run: python3 .github/scripts/fetch_public_holdout.py --discover-current-pin

      - name: Parse and test controller before Vast access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = (
              ".github/scripts/vast_rent_rebuild_dataset.py",
              ".github/scripts/vast_rebuild_remote_dataset.py",
              ".github/scripts/vast_probe_existing_2x3060.py",
              ".github/scripts/rebuild_frozen_dataset.py",
          )
          for path in paths:
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          PY
          python3 -m unittest discover -s .github/scripts -p 'test_vast_rent_rebuild_dataset.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_fetch_public_holdout.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_rebuild_frozen_dataset.py' -v
          python3 .github/scripts/fetch_public_holdout.py --metadata-check --expected-revision "$CNOT103_HOLDOUT_REVISION" --expected-sha256 "$CNOT103_HOLDOUT_SHA256"

      - name: Install Vast CLI
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Rent once and rebuild on the remote disk
        id: rent_dataset
        timeout-minutes: 160
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python3 .github/scripts/vast_rent_rebuild_dataset.py run

      - name: Stop only this run's instance and remove its temporary keys
        if: always() && steps.rent_dataset.outcome != 'skipped'
        timeout-minutes: 10
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python3 .github/scripts/vast_rent_rebuild_dataset.py cleanup

      - name: Publish redacted final status
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_STATE: ${{ job.status }}
        with:
          script: |
            const completed = process.env.RUN_STATE === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: completed ? "success" : "failure",
              context: "CNOT 2x3060 dataset rebuild",
              description: completed ? "completed" : "failed",
            });
