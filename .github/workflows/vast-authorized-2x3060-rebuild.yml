name: Authorized 2x3060 frozen 10k rebuild
run-name: One-shot 2x3060 dataset rebuild (wait for stop)

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/paid-runs/2026-11-20-rebuild-10k.json

permissions:
  contents: read

concurrency:
  group: cnot103-existing-2x3060-target
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'TryDotAtwo/cnot-neural-synth-frontier6'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Check out source pinned to this run
        uses: actions/checkout@v4

      - name: Parse and test controller before Vast access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = (
              ".github/scripts/vast_rent_rebuild_dataset.py",
              ".github/scripts/vast_rebuild_remote_dataset.py",
              ".github/scripts/vast_probe_existing_2x3060.py",
              ".github/scripts/rebuild_frozen_dataset.py",
          )
          for path in paths:
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          PY
          python3 -m unittest discover -s .github/scripts -p 'test_vast_rent_rebuild_dataset.py' -v
          python3 .github/scripts/fetch_public_holdout.py --metadata-check

      - name: Install Vast CLI
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cli_venv="$RUNNER_TEMP/vast-cli-venv"
          python3 -m venv "$cli_venv"
          "$cli_venv/bin/python" -m pip install --quiet --disable-pip-version-check vastai==1.11.2
          echo "$cli_venv/bin" >> "$GITHUB_PATH"

      - name: Rent once and rebuild on the remote disk
        timeout-minutes: 160
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python3 .github/scripts/vast_rent_rebuild_dataset.py run

      - name: Stop only this run's instance and remove its temporary keys
        if: always()
        timeout-minutes: 10
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python3 .github/scripts/vast_rent_rebuild_dataset.py cleanup
