name: CNOT full-training manifest checks

on:
  push:
    branches:
      - codex/full-feature-train-workflow
    paths:
      - .github/scripts/build_training_manifest.py
      - .github/scripts/test_build_training_manifest.py
      - .github/scripts/vast_full_training_controller.py
      - .github/scripts/test_full_training_controller.py
      - .github/scripts/run_full_training.py
      - .github/scripts/test_full_training_supervisor.py
      - .github/scripts/vast_rent_rebuild_dataset.py
      - .github/scripts/test_vast_rent_rebuild_dataset.py
      - .github/workflows/cnot-full-training-monitor.yml
      - .github/workflows/vast-full-training.yml
      - .github/workflows/cnot-full-training-inventory.yml
      - .github/paid-runs/2026-11-20-full-training.json
      - .github/workflows/check-full-training-manifest.yml
      - native/Cargo.toml
      - native/src/bin/cnot103_validate_data.rs
      - native/src/frozen_data.rs
      - native/src/frozen_data/**

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate the real CPU Rust loader on a clean synthetic fixture
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-cpu-target
          CNOT103_TEST_FIXTURE_PATH: ${{ runner.temp }}/cnot103-loader-fixture.json
        run: |
          set -euo pipefail
          cargo test --manifest-path native/Cargo.toml --lib frozen_data::tests::export_cpu_validator_fixture_for_ci
          cargo build --manifest-path native/Cargo.toml --bin cnot103-validate-data
          fixture_sha256="$(cat "${CNOT103_TEST_FIXTURE_PATH%.json}.sha256")"
          "${CARGO_TARGET_DIR}/debug/cnot103-validate-data" --test-fixture "$CNOT103_TEST_FIXTURE_PATH" "$fixture_sha256"

      - name: Test the training manifest contract
        run: python3 -m unittest discover -s .github/scripts -p 'test_build_training_manifest.py' -v
      - name: Test the full-run budget gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_full_training_controller.py' -v
      - name: Test the existing Vast billing and ownership boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_vast_rent_rebuild_dataset.py' -v

      - name: Parse monitor, inventory, and paid-run workflow YAML
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/cnot-full-training-monitor.yml .github/workflows/cnot-full-training-inventory.yml .github/workflows/vast-full-training.yml

      - name: Test the remote supervisor acceptance gates
        run: python3 -m unittest discover -s .github/scripts -p 'test_full_training_supervisor.py' -v
