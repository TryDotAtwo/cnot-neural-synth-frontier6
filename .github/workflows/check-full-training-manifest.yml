name: CNOT full-training source checks

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      checked_sha:
        description: Exact source commit checked by this reusable workflow
        value: ${{ jobs.source.outputs.checked_sha }}
  workflow_dispatch:
  push:
    branches:
      - codex/full-feature-train-workflow
    paths:
      - '.github/scripts/**'
      - '.github/training-profiles/**'
      - '.github/training-experiments/**'
      - '.github/workflows/**'
      - '.cargo/**'
      - 'native/**'
      - Cargo.lock
      - Cargo.toml

permissions:
  contents: read

jobs:
  source:
    outputs:
      checked_sha: ${{ steps.source_revision.outputs.checked_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Verify the checked-out source commit
        id: source_revision
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "checked_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo 'source_revision=stale'
            exit 1
          fi
          echo 'source_revision=matched'

      - name: Classify changed paths for the Rust loader
        id: loader_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          loader_required="$(python3 .github/scripts/full_training_loader_paths.py --source-sha-input "$SOURCE_SHA_INPUT" --event-name "$EVENT_NAME" --before "$BEFORE_SHA" --after "$SOURCE_SHA")"
          echo "loader_required=$loader_required" >> "$GITHUB_OUTPUT"
          echo "rust_loader_required=$loader_required"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate the real CPU Rust loader on a clean synthetic fixture
        if: ${{ steps.loader_scope.outputs.loader_required == 'true' }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-source-target
          CNOT103_TEST_FIXTURE_PATH: ${{ runner.temp }}/cnot103-loader-fixture.json
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path native/Cargo.toml --lib frozen_data::tests::export_cpu_validator_fixture_for_ci
          cargo build --locked --manifest-path native/Cargo.toml --bin cnot103-validate-data
          fixture_sha256="$(cat "$RUNNER_TEMP/cnot103-loader-fixture.sha256")"
          "$CARGO_TARGET_DIR/debug/cnot103-validate-data" --test-fixture "$CNOT103_TEST_FIXTURE_PATH" "$fixture_sha256"

      - name: Test source manifest, budget, ownership, supervisor, and quality gates
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_build_training_manifest.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_full_training_controller.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_vast_rent_rebuild_dataset.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_full_training_supervisor.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_molab_single_gpu_smoke.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_cnot_cpu_torch_ci.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_full_training_loader_paths.py' -v

      - name: Parse affected workflow YAML
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/check-full-training-manifest.yml \
            .github/workflows/validate-training-profile.yml \
            .github/workflows/cnot-full-training-monitor.yml \
            .github/workflows/cnot-full-training-inventory.yml \
            .github/workflows/vast-full-training-quote.yml \
            .github/workflows/vast-rebuild-remote-dataset.yml \
            .github/workflows/vast-authorized-2x3060-rebuild.yml \
            .github/workflows/vast-full-training.yml \
            .github/workflows/check-full-training-cpu-runtime.yml \
            .github/workflows/check-full-training-cuda-build.yml
