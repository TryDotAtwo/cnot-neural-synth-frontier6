name: CNOT full-training manifest checks

on:
  push:
    branches:
      - codex/full-feature-train-workflow
    paths:
      - .github/scripts/build_training_manifest.py
      - .github/scripts/test_build_training_manifest.py
      - .github/scripts/vast_full_training_controller.py
      - .github/scripts/test_full_training_controller.py
      - .github/scripts/run_full_training.py
      - .github/scripts/test_full_training_supervisor.py
      - .github/scripts/vast_rent_rebuild_dataset.py
      - .github/scripts/test_vast_rent_rebuild_dataset.py
      - .github/workflows/cnot-full-training-monitor.yml
      - .github/workflows/vast-full-training.yml
      - .github/workflows/vast-full-training-quote.yml
      - .github/workflows/vast-rebuild-remote-dataset.yml
      - .github/workflows/vast-authorized-2x3060-rebuild.yml
      - .github/workflows/cnot-full-training-inventory.yml
      - .github/paid-runs/2026-11-20-full-training.json
      - .github/workflows/check-full-training-manifest.yml
      - native/Cargo.toml
      - native/src/device_search.rs
      - native/src/device_search/**
      - .github/workflows/validate-training-profile.yml
      - native/src/bin/cnot103_validate_data.rs
      - native/src/frozen_data.rs
      - native/src/frozen_data/**

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate the real CPU Rust loader on a clean synthetic fixture
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot103-cpu-target
          CNOT103_TEST_FIXTURE_PATH: ${{ runner.temp }}/cnot103-loader-fixture.json
        run: |
          set -euo pipefail
          cargo test --manifest-path native/Cargo.toml --lib frozen_data::tests::export_cpu_validator_fixture_for_ci
          cargo build --manifest-path native/Cargo.toml --bin cnot103-validate-data
          fixture_sha256="$(cat "${CNOT103_TEST_FIXTURE_PATH%.json}.sha256")"
          "${CARGO_TARGET_DIR}/debug/cnot103-validate-data" --test-fixture "$CNOT103_TEST_FIXTURE_PATH" "$fixture_sha256"

      - name: Test the training manifest contract
        run: python3 -m unittest discover -s .github/scripts -p 'test_build_training_manifest.py' -v
      - name: Test the full-run budget gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_full_training_controller.py' -v
      - name: Test the existing Vast billing and ownership boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_vast_rent_rebuild_dataset.py' -v

      - name: Parse monitor, inventory, quote, rebuild, and training workflow YAML
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/cnot-full-training-monitor.yml .github/workflows/cnot-full-training-inventory.yml .github/workflows/vast-full-training-quote.yml .github/workflows/vast-rebuild-remote-dataset.yml .github/workflows/vast-authorized-2x3060-rebuild.yml .github/workflows/vast-full-training.yml


      - name: Test the compiled CUDA CNOT runtime on CPU tensors
        run: |
          set -euo pipefail
          cargo_home="$(dirname "$(dirname "$(command -v cargo)")")"
          rustup_home="$(rustup show home)"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace/project" \
            --volume "$RUNNER_TEMP:/runner_temp" \
            --volume "$cargo_home:/root/.cargo" \
            --volume "$rustup_home:/root/.rustup" \
            --workdir /workspace/project/native \
            --env CARGO_HOME=/root/.cargo \
            --env RUSTUP_HOME=/root/.rustup \
            --env PATH=/root/.cargo/bin:/usr/local/cuda/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env CARGO_TARGET_DIR=/runner_temp/cnot103-search-target \
            --env CNOT103_CUDA_ARCHITECTURES=86 \
            --env CUDA_HOME=/usr/local/cuda \
            --env LIBTORCH_USE_PYTORCH=1 \
            --env LD_LIBRARY_PATH=/opt/conda/lib/python3.11/site-packages/torch/lib:/usr/local/cuda/lib64 \
            pytorch/pytorch:2.9.0-cuda12.8-cudnn9-devel \
            bash -euc '/root/.cargo/bin/cargo test --quiet --features cuda --lib device_search::runtime::tests && /root/.cargo/bin/cargo build --quiet --features cuda --bin cnot103-search'
          echo 'compiled_cnot_runtime=passed'

      - name: Test the remote supervisor acceptance gates
        run: python3 -m unittest discover -s .github/scripts -p 'test_full_training_supervisor.py' -v
