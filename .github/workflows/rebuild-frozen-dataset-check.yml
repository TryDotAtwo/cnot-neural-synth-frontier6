name: Frozen dataset builder source check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/2x3060-full-feature-training
      - codex/f08-loader-stage-profile
    paths:
      - .github/scripts/rebuild_frozen_dataset.py
      - .github/scripts/vast_rebuild_remote_dataset.py
      - .github/scripts/test_rebuild_frozen_dataset.py
      - .github/scripts/build_training_manifest.py
      - .github/scripts/test_build_training_manifest.py
      - .github/scripts/vast_store_private_diagnostic.py
      - .github/scripts/fetch_public_holdout.py
      - .github/scripts/check_public_feature_profile.py
      - .github/scripts/test_check_public_feature_profile.py
      - .github/workflows/rebuild-frozen-dataset-check.yml
      - native/Cargo.toml
      - native/build.rs
      - 'native/cuda/**'
      - 'native/src/**'
      - native/src/bin/cnot103_validate_data.rs
      - native/src/bin/cnot103_validate_manifest.rs
      - native/src/run_config/manifest/**

permissions:
  contents: read

concurrency:
  group: tqp-cuda-feature-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-builder-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deterministic record and matrix routines
        run: python .github/scripts/rebuild_frozen_dataset.py --self-test

      - name: Test frozen dataset admission and receipt lifecycle
        run: python3 -m unittest discover -s .github/scripts -p 'test_rebuild_frozen_dataset.py' -v

      - name: Check the pinned training manifest builder
        run: python3 -m unittest discover -s .github/scripts -p 'test_build_training_manifest.py'


      - name: Parse the remote holdout fetcher without network access
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/fetch_public_holdout.py').read_text(encoding='utf-8'))"

      - name: Test the redacted feature-profile metadata checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_public_feature_profile.py' -v

      - name: Check public profile metadata without downloading the dataset
        run: python3 .github/scripts/check_public_feature_profile.py

      - name: Parse the private diagnostic transporter without network access
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/vast_store_private_diagnostic.py').read_text(encoding='utf-8'))"

      - name: Compile the canonical frozen-data validator
        uses: dtolnay/rust-toolchain@stable

      - name: Check the validator without CUDA or project data
        working-directory: native
        run: cargo check --no-default-features --bin cnot103-validate-data

  cuda-feature-build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.head_commit.modified, ','), 'native/') ||
      contains(join(github.event.head_commit.modified, ','), '.github/scripts/build_training_manifest.py')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust without apt or curl
        shell: bash
        run: |
          cargo_home="${RUNNER_TEMP}/cargo"
          rustup_home="${RUNNER_TEMP}/rustup"
          rustup_init="${RUNNER_TEMP}/rustup-init"
          log_file="${RUNNER_TEMP}/rustup-bootstrap.log"
          mkdir -p "${cargo_home}" "${rustup_home}"
          export CARGO_HOME="${cargo_home}"
          export RUSTUP_HOME="${rustup_home}"
          if [ -x "${cargo_home}/bin/rustup" ] && [ -x "${cargo_home}/bin/cargo" ]; then
            printf 'rust_bootstrap_dependency=pass\n'
            printf 'rust_bootstrap_dependency=pass\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            if python3 - "${rustup_init}" >"${log_file}" 2>&1 <<'PY'
          import pathlib
          import sys
          import urllib.parse
          import urllib.request
          destination = pathlib.Path(sys.argv[1])
          url = "https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init"
          request = urllib.request.Request(url, headers={"User-Agent": "TheQuantumProject-CUDA-build/1.0"})
          with urllib.request.urlopen(request, timeout=120) as response:
              if urllib.parse.urlparse(response.geturl()).hostname != "static.rust-lang.org":
                  raise RuntimeError("unexpected rustup download host")
              payload = response.read((64 << 20) + 1)
          if not payload or len(payload) > (64 << 20):
              raise RuntimeError("rustup bootstrap size is invalid")
          destination.write_bytes(payload)
          PY
            then
              if chmod 700 "${rustup_init}" >>"${log_file}" 2>&1 &&
                 "${rustup_init}" --default-toolchain stable --profile minimal --no-modify-path -y >>"${log_file}" 2>&1; then
                printf 'rust_bootstrap_dependency=pass\n'
                printf 'rust_bootstrap_dependency=pass\n' >> "${GITHUB_STEP_SUMMARY}"
              else
                printf 'rust_bootstrap_dependency=fail\n'
                printf 'rust_bootstrap_failure=rustup_install\n'
                printf 'rust_bootstrap_dependency=fail\n' >> "${GITHUB_STEP_SUMMARY}"
                printf 'rust_bootstrap_failure=rustup_install\n' >> "${GITHUB_STEP_SUMMARY}"
                exit 1
              fi
            else
              printf 'rust_bootstrap_dependency=fail\n'
              printf 'rust_bootstrap_failure=network_or_bootstrap\n'
              printf 'rust_bootstrap_dependency=fail\n' >> "${GITHUB_STEP_SUMMARY}"
              printf 'rust_bootstrap_failure=network_or_bootstrap\n' >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
          fi
      - name: Create manifest for in-job Rust validation
        run: |
          python3 .github/scripts/build_training_manifest.py --self-test --output "$RUNNER_TEMP/candidate-training-manifest.json"
          chmod 644 "$RUNNER_TEMP/candidate-training-manifest.json"

      - name: Build full CUDA training and benchmark binaries
        shell: bash
        run: |
          if docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace/project" \
            --volume "${RUNNER_TEMP}:/runner_temp" \
            --volume "${RUNNER_TEMP}/cargo:/root/.cargo" \
            --volume "${RUNNER_TEMP}/rustup:/root/.rustup" \
            --workdir /workspace/project/native \
            --env CARGO_HOME=/root/.cargo \
            --env RUSTUP_HOME=/root/.rustup \
            --env PATH=/root/.cargo/bin:/usr/local/cuda/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env CARGO_TARGET_DIR=/runner_temp/cargo-target \
            --env CNOT103_CUDA_ARCHITECTURES=86 \
            --env CUDA_HOME=/usr/local/cuda \
            --env LIBTORCH_USE_PYTORCH=1 \
            --env LD_LIBRARY_PATH=/opt/conda/lib/python3.11/site-packages/torch/lib:/usr/local/cuda/lib64 \
            pytorch/pytorch:2.9.0-cuda12.8-cudnn9-devel \
            bash -euc '/root/.cargo/bin/cargo build --message-format=json --features cuda --bin cnot103-train --bin cnot103-benchmark --bin cnot103-validate-manifest > /runner_temp/cuda-feature-build.jsonl 2>&1; /root/.cargo/bin/cargo test --features cuda --lib run_config::manifest::tests; /root/.cargo/bin/cargo test --features cuda --lib model::device_packet::frozen::winner_activity_tests; /root/.cargo/bin/cargo run --quiet --features cuda --bin cnot103-validate-manifest -- /runner_temp/candidate-training-manifest.json'; then
            printf 'cuda_feature_build=pass\n'
            printf 'cuda_feature_build=pass\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'cuda_feature_build=fail\n'
            printf 'cuda_feature_build=fail\n' >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
      - name: Store private compiler diagnostics on the existing Vast disk
        if: failure()
        continue-on-error: true
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          PRIVATE_DIAGNOSTIC_PATH: ${{ runner.temp }}/cuda-feature-build.jsonl
        run: python3 .github/scripts/vast_store_private_diagnostic.py
