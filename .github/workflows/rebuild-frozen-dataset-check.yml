name: Frozen dataset builder source check

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/scripts/rebuild_frozen_dataset.py
      - .github/scripts/fetch_public_holdout.py
      - .github/workflows/rebuild-frozen-dataset-check.yml
      - native/Cargo.toml
      - native/build.rs
      - 'native/cuda/**'
      - 'native/src/**'
      - native/src/bin/cnot103_validate_data.rs

permissions:
  contents: read

jobs:
  deterministic-builder-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deterministic record and matrix routines
        run: python .github/scripts/rebuild_frozen_dataset.py --self-test

      - name: Parse the remote holdout fetcher without network access
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/fetch_public_holdout.py').read_text(encoding='utf-8'))"

      - name: Compile the canonical frozen-data validator
        uses: dtolnay/rust-toolchain@stable

      - name: Check the validator without CUDA or project data
        working-directory: native
        run: cargo check --no-default-features --bin cnot103-validate-data

  cuda-feature-build:
    runs-on: ubuntu-latest
    container:
      image: pytorch/pytorch:2.9.0-cuda12.8-cudnn9-devel
    timeout-minutes: 45
    env:
      CNOT103_CUDA_ARCHITECTURES: "86"
      CUDA_HOME: /usr/local/cuda
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust bootstrap dependency
        shell: bash
        run: |
          log_file="${RUNNER_TEMP}/curl-install.log"
          if command -v curl >/dev/null 2>&1; then
            printf 'rust_bootstrap_dependency=pass\n'
          elif apt-get update -qq >"${log_file}" 2>&1 && apt-get install -y --no-install-recommends curl >>"${log_file}" 2>&1; then
            printf 'rust_bootstrap_dependency=pass\n'
          else
            printf 'rust_bootstrap_dependency=fail\n'
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build full CUDA training and benchmark binaries
        shell: bash
        working-directory: native
        run: |
          log_file="${RUNNER_TEMP}/cuda-feature-build.log"
          if cargo build --features cuda --bin cnot103-train --bin cnot103-benchmark >"${log_file}" 2>&1; then
            printf 'cuda_feature_build=pass\n'
            printf 'cuda_feature_build=pass\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'cuda_feature_build=fail\n'
            failure_class="other_build_failure"
            if grep -Eiq 'nvcc fatal|unsupported gpu architecture|cuda compiler.*not found' "${log_file}"; then
              failure_class="cuda_toolchain"
            elif grep -Eiq 'error\[E[0-9]+\]|could not compile `?cnot103' "${log_file}"; then
              failure_class="rust_compile"
            elif grep -Eiq 'undefined reference|cannot find -l|ld returned|linker.*failed' "${log_file}"; then
              failure_class="link"
            elif grep -Eiq 'no space left|out of memory|killed signal' "${log_file}"; then
              failure_class="runner_resource"
            elif grep -Eiq 'timed out|failed to download|failed to get|could not resolve|connection reset' "${log_file}"; then
              failure_class="network"
            elif grep -Eiq 'could not find|not found|no such file|cmake error' "${log_file}"; then
              failure_class="dependency_or_cmake"
            fi
            printf 'cuda_build_failure=%s\n' "${failure_class}"
            printf 'cuda_feature_build=fail\n' >> "${GITHUB_STEP_SUMMARY}"
            printf 'cuda_build_failure=%s\n' "${failure_class}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

