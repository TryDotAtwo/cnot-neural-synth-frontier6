name: Frozen dataset builder source check

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/scripts/rebuild_frozen_dataset.py
      - .github/scripts/fetch_public_holdout.py
      - .github/workflows/rebuild-frozen-dataset-check.yml
      - native/Cargo.toml
      - native/build.rs
      - 'native/cuda/**'
      - 'native/src/**'
      - native/src/bin/cnot103_validate_data.rs

permissions:
  contents: read

jobs:
  deterministic-builder-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deterministic record and matrix routines
        run: python .github/scripts/rebuild_frozen_dataset.py --self-test

      - name: Parse the remote holdout fetcher without network access
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/fetch_public_holdout.py').read_text(encoding='utf-8'))"

      - name: Compile the canonical frozen-data validator
        uses: dtolnay/rust-toolchain@stable

      - name: Check the validator without CUDA or project data
        working-directory: native
        run: cargo check --no-default-features --bin cnot103-validate-data

  cuda-feature-build:
    runs-on: ubuntu-latest
    container:
      image: pytorch/pytorch:2.9.0-cuda12.8-cudnn9-devel
    timeout-minutes: 45
    env:
      CNOT103_CUDA_ARCHITECTURES: "86"
      CUDA_HOME: /usr/local/cuda
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build full CUDA training and benchmark binaries
        shell: bash
        working-directory: native
        run: |
          log_file="${RUNNER_TEMP}/cuda-feature-build.log"
          if cargo build --features cuda --bin cnot103-train --bin cnot103-benchmark >"${log_file}" 2>&1; then
            printf 'cuda_feature_build=pass\n'
            printf 'cuda_feature_build=pass\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'cuda_feature_build=fail\n'
            printf 'cuda_feature_build=fail\n' >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

