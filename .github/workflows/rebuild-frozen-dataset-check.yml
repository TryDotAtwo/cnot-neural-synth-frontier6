name: Frozen dataset builder source check

on:
  push:
    branches:
      - codex/2x3060-full-feature-training
    paths:
      - .github/scripts/rebuild_frozen_dataset.py
      - .github/scripts/vast_store_private_diagnostic.py
      - .github/scripts/fetch_public_holdout.py
      - .github/workflows/rebuild-frozen-dataset-check.yml
      - native/Cargo.toml
      - native/build.rs
      - 'native/cuda/**'
      - 'native/src/**'
      - native/src/bin/cnot103_validate_data.rs

permissions:
  contents: read

concurrency:
  group: tqp-cuda-feature-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-builder-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deterministic record and matrix routines
        run: python .github/scripts/rebuild_frozen_dataset.py --self-test

      - name: Parse the remote holdout fetcher without network access
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/fetch_public_holdout.py').read_text(encoding='utf-8'))"

      - name: Parse the private diagnostic transporter without network access
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/vast_store_private_diagnostic.py').read_text(encoding='utf-8'))"

      - name: Compile the canonical frozen-data validator
        uses: dtolnay/rust-toolchain@stable

      - name: Check the validator without CUDA or project data
        working-directory: native
        run: cargo check --no-default-features --bin cnot103-validate-data

  cuda-feature-build:
    runs-on: ubuntu-latest
    container:
      image: pytorch/pytorch:2.9.0-cuda12.8-cudnn9-devel
    timeout-minutes: 45
    env:
      CNOT103_CUDA_ARCHITECTURES: "86"
      CUDA_HOME: /usr/local/cuda
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust without apt or curl
        shell: bash
        run: |
          cargo_bin="${HOME}/.cargo/bin"
          rustup_init="${RUNNER_TEMP}/rustup-init"
          log_file="${RUNNER_TEMP}/rustup-bootstrap.log"
          if command -v rustup >/dev/null 2>&1 && command -v cargo >/dev/null 2>&1; then
            printf 'rust_bootstrap_dependency=pass\n'
            printf 'rust_bootstrap_dependency=pass\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            if python3 - "${rustup_init}" >"${log_file}" 2>&1 <<'PY'
          import pathlib
          import sys
          import urllib.parse
          import urllib.request
          destination = pathlib.Path(sys.argv[1])
          url = "https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init"
          request = urllib.request.Request(url, headers={"User-Agent": "TheQuantumProject-CUDA-build/1.0"})
          with urllib.request.urlopen(request, timeout=120) as response:
              if urllib.parse.urlparse(response.geturl()).hostname != "static.rust-lang.org":
                  raise RuntimeError("unexpected rustup download host")
              payload = response.read((64 << 20) + 1)
          if not payload or len(payload) > (64 << 20):
              raise RuntimeError("rustup bootstrap size is invalid")
          destination.write_bytes(payload)
          PY
            then
              if chmod 700 "${rustup_init}" >>"${log_file}" 2>&1 &&
                 "${rustup_init}" --default-toolchain stable --profile minimal --no-modify-path -y >>"${log_file}" 2>&1; then
                export PATH="${cargo_bin}:${PATH}"
                printf '%s\n' "${cargo_bin}" >> "${GITHUB_PATH}"
                printf 'rust_bootstrap_dependency=pass\n'
                printf 'rust_bootstrap_dependency=pass\n' >> "${GITHUB_STEP_SUMMARY}"
              else
                failure_class="rustup_install"
                if grep -Eiq 'temporary failure resolving|could not resolve|failed to download|connection timed out|network is unreachable|connection reset|connection refused|name or service not known' "${log_file}"; then
                  failure_class="network"
                elif grep -Eiq '404|not found|no release found' "${log_file}"; then
                  failure_class="rustup_artifact"
                fi
                printf 'rust_bootstrap_dependency=fail\n'
                printf 'rust_bootstrap_failure=%s\n' "${failure_class}"
                printf 'rust_bootstrap_dependency=fail\n' >> "${GITHUB_STEP_SUMMARY}"
                printf 'rust_bootstrap_failure=%s\n' "${failure_class}" >> "${GITHUB_STEP_SUMMARY}"
                exit 1
              fi
            else
              failure_class="bootstrap_download"
              if grep -Eiq 'temporary failure resolving|could not resolve|urlopen error|connection timed out|network is unreachable|connection reset|connection refused|name or service not known' "${log_file}"; then
                failure_class="network"
              elif grep -Eiq 'python3: command not found|permission denied|operation not permitted' "${log_file}"; then
                failure_class="runner_environment"
              fi
              printf 'rust_bootstrap_dependency=fail\n'
              printf 'rust_bootstrap_failure=%s\n' "${failure_class}"
              printf 'rust_bootstrap_dependency=fail\n' >> "${GITHUB_STEP_SUMMARY}"
              printf 'rust_bootstrap_failure=%s\n' "${failure_class}" >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
          fi
      - name: Build full CUDA training and benchmark binaries
        shell: bash
        working-directory: native
        run: |
          log_file="${RUNNER_TEMP}/cuda-feature-build.jsonl"
          safe_status="${RUNNER_TEMP}/cuda-feature-build.status"
          if cargo build --message-format=json --features cuda --bin cnot103-train --bin cnot103-benchmark >"${log_file}" 2>&1; then
            printf 'cuda_feature_build=pass\n'
            printf 'cuda_feature_build=pass\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'cuda_feature_build=fail\n'
            printf 'cuda_feature_build=fail\n' >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
      - name: Store private compiler diagnostics on the existing Vast disk
        if: failure()
        continue-on-error: true
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          PRIVATE_DIAGNOSTIC_PATH: ${{ runner.temp }}/cuda-feature-build.jsonl
        run: python3 .github/scripts/vast_store_private_diagnostic.py
