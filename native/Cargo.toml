[package]
name = "cnot103-native"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "cnot103_native"
crate-type = ["rlib", "cdylib"]

[features]
default = []
torch = ["dep:tch"]
cuda = ["torch"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
num-bigint = "=0.4.6"
tch = { version = "=0.22.0", optional = true }

[build-dependencies]
cmake = "0.1"

[[test]]
name = "tch_training_resume"
path = "tests/tch_training_resume.rs"
required-features = ["torch"]

[[test]]
name = "bellman_objective"
path = "tests/bellman_objective.rs"
required-features = ["torch"]

[[test]]
name = "model_layout"
path = "tests/model_layout.rs"
required-features = ["torch"]

[[test]]
name = "cuda_children"
path = "tests/cuda_children.rs"
required-features = ["cuda"]

[[test]]
name = "training_data"
path = "tests/training_data.rs"
