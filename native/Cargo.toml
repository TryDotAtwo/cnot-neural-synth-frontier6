[package]
name = "cnot103-native"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "cnot103_native"
crate-type = ["rlib"]

[[bin]]
name = "cnot103-validate-data"
path = "src/bin/cnot103_validate_data.rs"

[[bin]]
name = "cnot103-validate-manifest"
path = "src/bin/cnot103_validate_manifest.rs"
required-features = ["cuda"]

