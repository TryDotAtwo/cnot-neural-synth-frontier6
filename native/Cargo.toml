[features]
default = []
torch = ["dep:tch"]
cuda = ["torch"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
num-bigint = "=0.4.6"
tch = { version = "=0.22.0", optional = true }

[build-dependencies]
cmake = "0.1"

# Large, verified checkpoints hash gigabytes even in development runs.
[profile.dev.package.sha2]
opt-level = 3

